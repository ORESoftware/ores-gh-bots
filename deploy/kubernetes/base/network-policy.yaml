apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ores-gh-bots
  namespace: ores-gh-bots
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ores-gh-bots
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
