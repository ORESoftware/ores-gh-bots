apiVersion: v1
kind: ConfigMap
metadata:
  name: ores-gh-bots-config
  namespace: ores-gh-bots
data:
  PORT: "8080"
  GITHUB_WEBHOOK_PATH: /webhooks/github
  GITHUB_API_VERSION: "2026-03-10"
  QUEUE_PATH: /data/ores-gh-bots.sqlite
  WORKER_CONCURRENCY: "2"
  RECONCILE_ENABLED: "true"
  RECONCILE_INTERVAL_MS: "600000"
  GHA_MODE: disabled
  MAX_DIFF_BYTES: "500000"
  MAX_FILE_BYTES: "80000"
  MAX_FILES: "200"
  MAX_FINDINGS: "30"
  REVIEW_TIMEOUT_MS: "180000"
