name: ORES review dispatch

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Pull-request repository owner
        required: true
        type: string
      repo:
        description: Pull-request repository name
        required: true
        type: string
      pr_number:
        description: Pull-request number
        required: true
        type: string
      head_sha:
        description: Exact PR head SHA expected by the dispatcher
        required: true
        type: string
      installation_id:
        description: Orchestrator App installation ID hint; verified against the repository
        required: false
        type: string
      reason:
        description: Dispatch reason
        required: false
        default: github-actions-dispatch
        type: string

permissions:
  contents: read

concurrency:
  group: ores-review-${{ inputs.owner }}-${{ inputs.repo }}-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: canary
    steps:
      - name: Check out trusted reviewer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install exact lockfile and build the pinned flags-2-env binding
        run: npm ci
      - name: Validate trusted reviewer source
        run: npm run check
      - name: Review exact pull-request head
        env:
          REVIEW_OWNER: ${{ inputs.owner }}
          REVIEW_REPO: ${{ inputs.repo }}
          REVIEW_PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_INSTALLATION_ID: ${{ inputs.installation_id }}
          REVIEW_REASON: ${{ inputs.reason }}
          OWNER_ALLOWLIST: ${{ vars.OWNER_ALLOWLIST }}
          OWNER_PATTERNS: ${{ vars.OWNER_PATTERNS }}
          GITHUB_APP_ID: ${{ secrets.ORCHESTRATOR_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.ORCHESTRATOR_APP_PRIVATE_KEY }}
          OPENAI_REVIEW_APP_ID: ${{ secrets.OPENAI_REVIEW_APP_ID }}
          OPENAI_REVIEW_APP_PRIVATE_KEY: ${{ secrets.OPENAI_REVIEW_APP_PRIVATE_KEY }}
          CLAUDE_REVIEW_APP_ID: ${{ secrets.CLAUDE_REVIEW_APP_ID }}
          CLAUDE_REVIEW_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}
          GATE_APP_ID: ${{ secrets.GATE_APP_ID }}
          GATE_APP_PRIVATE_KEY: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
          REQUIRED_CI_CONTEXTS: ${{ vars.REQUIRED_CI_CONTEXTS }}
          REQUIRED_CI_APP_IDS: ${{ vars.REQUIRED_CI_APP_IDS }}
        run: node apps/runner/src/main.mjs review
