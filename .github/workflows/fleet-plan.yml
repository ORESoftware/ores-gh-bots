name: Fleet ruleset plan

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: canary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install exact lockfile and build the pinned flags-2-env binding
        run: npm ci
      - name: Generate a no-write all-branch ruleset plan
        env:
          OWNER_ALLOWLIST: ${{ vars.OWNER_ALLOWLIST }}
          OWNER_PATTERNS: ${{ vars.OWNER_PATTERNS }}
          GITHUB_APP_ID: ${{ secrets.ORCHESTRATOR_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.ORCHESTRATOR_APP_PRIVATE_KEY }}
          OPENAI_REVIEW_APP_ID: ${{ secrets.OPENAI_REVIEW_APP_ID }}
          CLAUDE_REVIEW_APP_ID: ${{ secrets.CLAUDE_REVIEW_APP_ID }}
          GATE_APP_ID: ${{ secrets.GATE_APP_ID }}
          GITHUB_ADMIN_TOKEN: ${{ secrets.GITHUB_ADMIN_TOKEN }}
        run: node apps/cli/src/main.mjs rulesets plan --branch-mode all > ruleset-plan.json
      - name: Add plan summary
        run: |
          {
            echo '## ORES all-branch ruleset plan'
            echo '```json'
            cat ruleset-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
