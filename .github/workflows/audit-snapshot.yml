name: Audit source snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create deterministic source snapshot
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/source-snapshot.tar.gz"
          checksum="$RUNNER_TEMP/source-snapshot.tar.gz.sha256"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --exclude=.git \
            -czf "$archive" .
          sha256sum "$archive" > "$checksum"
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-snapshot.tar.gz
            ${{ runner.temp }}/source-snapshot.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
