name: Audit source snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create deterministic source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --exclude=.git \
            --exclude=source-snapshot.tar.gz \
            -czf source-snapshot.tar.gz .
          sha256sum source-snapshot.tar.gz > source-snapshot.tar.gz.sha256
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: |
            source-snapshot.tar.gz
            source-snapshot.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
