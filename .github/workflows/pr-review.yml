name: ORES dual-model PR review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ores-dual-review-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.pull_request.draft == false && vars.ORES_PR_REVIEW_ACTIONS_FALLBACK_ENABLED != 'false' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: canary
    steps:
      - name: Check out trusted reviewer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install exact lockfile
        run: npm ci --ignore-scripts
      - name: Validate trusted reviewer source
        run: npm run check
      - name: Review exact pull-request head with Astra and Fable
        env:
          REVIEW_OWNER: ${{ github.repository_owner }}
          REVIEW_REPO: ${{ github.event.repository.name }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_REASON: github-actions-pull_request_target
          OWNER_ALLOWLIST: ${{ github.repository_owner }}
          GITHUB_APP_ID: ${{ secrets.ORCHESTRATOR_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.ORCHESTRATOR_APP_PRIVATE_KEY }}
          OPENAI_REVIEW_APP_ID: ${{ secrets.OPENAI_REVIEW_APP_ID }}
          OPENAI_REVIEW_APP_PRIVATE_KEY: ${{ secrets.OPENAI_REVIEW_APP_PRIVATE_KEY }}
          CLAUDE_REVIEW_APP_ID: ${{ secrets.CLAUDE_REVIEW_APP_ID }}
          CLAUDE_REVIEW_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}
          GATE_APP_ID: ${{ secrets.GATE_APP_ID }}
          GATE_APP_PRIVATE_KEY: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-astra
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-fable-5-1
          REQUIRED_CI_CONTEXTS: ${{ vars.REQUIRED_CI_CONTEXTS }}
          REQUIRED_CI_APP_IDS: ${{ vars.REQUIRED_CI_APP_IDS }}
        run: node apps/runner/src/main.mjs review
