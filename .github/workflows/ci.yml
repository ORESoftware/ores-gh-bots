name: CI

on:
  push:
    branches: ['**']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install exact lockfile and build the pinned flags-2-env binding
        run: npm ci
      - name: Lint and test
        run: npm run check
      - name: Verify repository inventory
        run: npm run verify
      - name: Build the pinned runtime image
        run: docker build --pull=false --tag ores-gh-bots:${{ github.sha }} .
