name: Publish validated DEN-3570 source once

on:
  push:
    branches:
      - agent/den-3793-nightly-merge-reaper
    paths:
      - .github/workflows/apply-reaper-bundle-once.yml

permissions:
  contents: write

concurrency:
  group: publish-den-3570-source
  cancel-in-progress: false

jobs:
  validate-and-publish-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/den-3793-nightly-merge-reaper
          fetch-depth: 0
          persist-credentials: true

      - name: Reassemble reviewed source and apply guarded corrections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reaper-bundle"
          cat .changes/den-3793-reaper.bundle.part00 \
              .changes/den-3793-reaper.bundle.part01 \
              .changes/den-3793-reaper.bundle.part02 \
              .changes/den-3793-reaper.bundle.part03.0 \
              .changes/den-3793-reaper.bundle.part03.1 \
              .changes/den-3793-reaper.bundle.part04.0 \
              .changes/den-3793-reaper.bundle.part04.1 \
            | base64 --decode > "$RUNNER_TEMP/reaper-bundle/den-3793-reaper-files.tar.gz"
          echo '5305d8cb5afac5254fcb6185b2a191ba48d25f356bd44f528730c434c61d4083  '"$RUNNER_TEMP/reaper-bundle/den-3793-reaper-files.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/reaper-bundle/den-3793-reaper-files.tar.gz" -C .
          python3 .changes/den-3793-post.py

      - name: Install and validate the complete stacked source
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Run every source and policy gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run verify
          git diff --check

      - name: Commit only non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .changes
          rm -f .github/workflows/nightly-merge-reaper.yml
          git add -A -- ':!/.github/workflows/apply-reaper-bundle-once.yml' ':!/.github/workflows/export-source-once.yml'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source delta remained after validation.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(DEN-3570): add dependency-aware merge reaper source'
          git push origin HEAD:agent/den-3793-nightly-merge-reaper
