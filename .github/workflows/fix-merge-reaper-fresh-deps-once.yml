name: repair reaper fresh dependency boundary once

on:
  push:
    branches:
      - salvage/merge-reaper-runtime-20260920
    paths:
      - '.github/workflows/fix-merge-reaper-fresh-deps-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: salvage/merge-reaper-runtime-20260920
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Rewrite final dependency boundary from reviewed exact source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/reaper/src/main.mjs')
          source = path.read_text()

          import_anchor = "} from '../../../packages/github/src/index.mjs';\n"
          import_line = "import { resolveFreshDependencyStates } from './dependency-states.mjs';\n"
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('GitHub import anchor changed; refusing blind rewrite')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          old_fresh = '''async function freshInspection({ candidate, repository, client, auth, policy, gateAppId }) {
            const token = await auth.installationToken('reaper', repository.installationId);
            return inspectPullRequest({
              client,
              token,
              repository,
              listedPullRequest: { number: candidate.number },
              policy,
              gateAppId,
              now: new Date(),
              stackedDependency: candidate.dependencies.find((dependency) => dependency.startsWith(`${candidate.repository}#`)),
            });
          }'''

          new_fresh = '''async function freshInspection({ candidate, repository, client, auth, policy, gateAppId }) {
            const token = await auth.installationToken('reaper', repository.installationId);
            const fresh = await inspectPullRequest({
              client,
              token,
              repository,
              listedPullRequest: { number: candidate.number },
              policy,
              gateAppId,
              now: new Date(),
              stackedDependency: null,
            });
            const pulls = await listOpenPullRequests(
              client,
              token,
              repository.owner,
              repository.repo,
              policy.maxPullRequestsPerRepository,
            );
            const stackedBase = pulls.find((pullRequest) => (
              pullRequest.number !== fresh.number && pullRequest.head?.ref === fresh.baseBranch
            ));
            fresh.dependencies = unique([
              ...fresh.dependencies,
              ...(stackedBase ? [pullRequestKey(repository.owner, repository.repo, stackedBase.number)] : []),
            ]).filter((dependency) => dependency !== fresh.key).sort();
            return fresh;
          }'''

          old_states = '''        const dependencyStates = Object.fromEntries(candidate.dependencies.map((dependency) => [
                    dependency,
                    candidateByKey.has(dependency)
                      ? (mergedKeys.has(dependency) ? 'merged' : 'candidate-blocked')
                      : (candidate.dependencyStates?.[dependency] ?? 'unavailable'),
                  ]));'''

          new_states = '''        const dependencyCache = new Map();
                  const dependencyStates = await resolveFreshDependencyStates({
                    freshDependencies: fresh.dependencies,
                    mergedKeys,
                    resolveLiveDependency: (dependency) => resolveDependency({
                      dependency,
                      candidateByKey: new Map(),
                      auth,
                      client,
                      cache: dependencyCache,
                    }),
                  });'''

          if old_fresh not in source:
              raise SystemExit('freshInspection exact source did not match; refusing blind rewrite')
          if old_states not in source:
              raise SystemExit('final dependency-state exact source did not match; refusing blind rewrite')

          source = source.replace(old_fresh, new_fresh, 1).replace(old_states, new_states, 1)
          path.write_text(source)
          PY
          git diff --check
      - name: Verify merge-reaper tests including mutable-metadata regression
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test \
            test/merge-reaper.test.mjs \
            test/merge-reaper-runtime.test.mjs \
            test/merge-reaper-fresh-dependencies.test.mjs
      - name: Commit repaired runtime
        run: |
          set -euo pipefail
          git config user.name ORESoftware
          git config user.email noreply@github.com
          git add apps/reaper/src/main.mjs
          git diff --cached --check
          git commit -m 'fix(reaper): resolve fresh dependencies at merge boundary'
          git push origin HEAD:salvage/merge-reaper-runtime-20260920
