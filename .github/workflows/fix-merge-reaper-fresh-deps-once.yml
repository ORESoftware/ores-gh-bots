name: repair reaper fresh dependency boundary once

on:
  push:
    branches:
      - salvage/merge-reaper-runtime-20260920
    paths:
      - '.github/workflows/fix-merge-reaper-fresh-deps-once.yml'
      - '.github/patches/reaper-fresh-dependency-boundary.patch'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: salvage/merge-reaper-runtime-20260920
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Apply reviewed source patch
        run: |
          set -euo pipefail
          git apply --check .github/patches/reaper-fresh-dependency-boundary.patch
          git apply .github/patches/reaper-fresh-dependency-boundary.patch
          git diff --check
      - name: Verify merge-reaper tests
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/merge-reaper.test.mjs test/merge-reaper-runtime.test.mjs
      - name: Commit repaired runtime
        run: |
          set -euo pipefail
          git config user.name ORESoftware
          git config user.email noreply@github.com
          git add apps/reaper/src/main.mjs
          git diff --cached --check
          git commit -m 'fix(reaper): resolve fresh dependencies at merge boundary'
          git push origin HEAD:salvage/merge-reaper-runtime-20260920
