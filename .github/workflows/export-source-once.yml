name: Export exact stacked source once

on:
  push:
    branches:
      - agent/den-3793-nightly-merge-reaper
    paths:
      - .github/workflows/export-source-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Create deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github/workflows/export-source-once.yml' \
            --sort=name \
            --mtime='UTC 2026-09-02' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$RUNNER_TEMP/ores-gh-bots-source.tar.gz" .
          sha256sum "$RUNNER_TEMP/ores-gh-bots-source.tar.gz" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ores-gh-bots-source
          path: ${{ runner.temp }}/ores-gh-bots-source.tar.gz
          if-no-files-found: error
          retention-days: 1
