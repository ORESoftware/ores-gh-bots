name: Publish immutable ores-gh-bots image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.arm64.dkf
      - Dockerfile.x86_64.dkf
      - entrypoint.sh
      - package.json
      - package-lock.json
      - .cli-flags.toml
      - .dockerignore
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ORESoftware/ores-gha-workflows/.github/workflows/container-images.yml@c0a04a25d73cb699235066fb21200ddc5abe03bd
    with:
      image-name: oresoftware/ores-gh-bots
      context: .
      arm64: true
      amd64: true
      push: true

  receipt:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve immutable manifest digest
        env:
          IMAGE_REF: ${{ needs.image.outputs.manifest }}
        run: |
          set -euo pipefail
          test -n "${IMAGE_REF}"
          digest="$(docker buildx imagetools inspect "${IMAGE_REF}" | awk '/^Digest:/ {print $2; exit}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '{"source_sha":"%s","image":"%s","digest":"%s"}\n' \
            "${GITHUB_SHA}" "${IMAGE_REF}" "${digest}" > image-receipt.json
          printf 'Published `%s@%s` from `%s`.\n' "${IMAGE_REF%%:*}" "${digest}" "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload immutable image receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ores-gh-bots-image-receipt-${{ github.sha }}
          path: image-receipt.json
          if-no-files-found: error
          retention-days: 30
