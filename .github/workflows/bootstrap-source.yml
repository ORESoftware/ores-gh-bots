name: Bootstrap monorepo source

on:
  push:
    paths:
      - '.bootstrap/source.part-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-monorepo-source
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Restore verified source tree
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/source.part-*)
          if [[ ${#parts[@]} -ne 13 ]]; then
            echo "Waiting for all thirteen source parts; found ${#parts[@]}."
            exit 0
          fi
          cat "${parts[@]}" | base64 --decode > /tmp/ores-gh-bots-source.tar.gz
          echo '180fc8236ad4bd4dbde95a64e1e4cd1316a882119dfbd6ca9752f32d756975a7  /tmp/ores-gh-bots-source.tar.gz' | sha256sum --check --strict
          git rm -r --ignore-unmatch .
          tar -xzf /tmp/ores-gh-bots-source.tar.gz -C .
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add event-driven dual-AI PR review control plane'
          git push origin HEAD:main
